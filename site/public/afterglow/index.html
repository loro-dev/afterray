<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Afterglow shader lab</title>
<style>
  :root {
    --bg: #060607;
    --ink: #f2ede2;
    --ink-dim: rgba(242, 237, 226, 0.55);
    --accent: #ff4a3d;
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); overflow: hidden; font-family: -apple-system, 'PingFang SC', sans-serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* candidate 5: pure CSS mesh-gradient afterglow (no WebGL at all) */
  #cssGlow { position: fixed; inset: 0; display: none; overflow: hidden; }
  #cssGlow .blob {
    position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%;
    filter: blur(9vmax); opacity: 0.8;
  }
  #cssGlow .b1 {
    right: -25vmax; bottom: -35vmax;
    background: radial-gradient(circle, rgba(255, 74, 61, 0.6), rgba(179, 35, 24, 0.22) 45%, transparent 70%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  #cssGlow .b2 {
    left: -30vmax; top: -30vmax;
    background: radial-gradient(circle, rgba(255, 122, 61, 0.3), transparent 65%);
    animation: drift2 34s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(-12vmax, -8vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(10vmax, 9vmax) scale(0.9); } }

  .hud {
    position: fixed; left: 2rem; bottom: 2rem; z-index: 2; max-width: 30rem;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.8);
  }
  .hud .idx { font-family: var(--mono); font-size: 0.72rem; color: var(--accent); letter-spacing: 0.14em; }
  .hud h1 { font-size: 1.6rem; font-weight: 600; margin: 0.3rem 0 0.4rem; }
  .hud p { color: var(--ink-dim); font-size: 0.88rem; line-height: 1.6; }
  .hud .cost { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-dim); margin-top: 0.5rem; }
  .hint {
    position: fixed; top: 1.4rem; right: 2rem; z-index: 2;
    font-family: var(--mono); font-size: 0.7rem; color: var(--ink-dim);
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="cssGlow"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="hint">← / → 切换（数字键 1–9 直达）</div>
<div class="hud">
  <div class="idx" id="idx"></div>
  <h1 id="name"></h1>
  <p id="desc"></p>
  <div class="cost" id="cost"></div>
</div>

<script type="module">
const PRELUDE = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_mouse;

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++) {
    v += a * vnoise(p);
    p = p * 2.13 + vec2(17.3, 9.1);
    a *= 0.5;
  }
  return v;
}
float dither() {
  return (hash12(gl_FragCoord.xy + fract(u_time) * 61.7) - 0.5) * (4.0 / 255.0);
}
`

  float t = u_time * 0.05;
  float beams = fbm(vec2(ang * 2.5, t)) * 0.7 + fbm(vec2(ang * 6.0, -t * 1.7)) * 0.3;
  float ray = pow(smoothstep(0.32, 0.95, beams), 1.8);
  float fall = exp(-dist * 1.9);
  vec3 col = vec3(0.024, 0.024, 0.027);
  col += vec3(1.0, 0.29, 0.24) * ray * fall * 0.85;
  col += vec3(1.0, 0.62, 0.38) * exp(-dist * 3.5) * 0.8;
  col += vec3(1.0, 0.88, 0.72) * exp(-dist * 11.0) * 0.8;
  col = col / (1.0 + col * 0.55);
  col += dither();
  gl_FragColor = vec4(col, 1.0);
}`,

    cost: '每像素 2 层粒子网格 · 无 fbm · 开销极低',

    float density = pow(clamp(streak * 1.1, 0.0, 1.4), 1.8);
    float radial = smoothstep(0.0, 0.12, u) * exp(-u * 1.8);
    float dop = clamp(1.0 - 0.55 * (len.x / max(r, 0.2)), 0.3, 1.8);
    vec3 diskCol = mix(vec3(1.0, 0.85, 0.70), vec3(0.9, 0.15, 0.08), smoothstep(0.05, 0.6, u));
    col += diskCol * density * radial * dop * 1.2;
  }

  // photon ring + halo, then the shadow itself with a soft rim
  col += vec3(1.0, 0.45, 0.25) * exp(-abs(b - bc) * 30.0) * 0.9;
  col += vec3(1.0, 0.40, 0.22) * exp(-max(b - bc, 0.0) * 5.0) * 0.22;
  float edge = smoothstep(bc * 0.90, bc * 1.04, b);
  col = mix(vec3(0.010, 0.010, 0.012), col, edge);

  col = col / (1.0 + col * 0.5);
  col += dither();
  gl_FragColor = vec4(col, 1.0);
}`,
  },
  {
    name: '黑洞 · Logo 同源',
    desc: '按 logo 的构图重排：纯净阴影 + 细光子环 + 一条斜穿的光。光在透镜空间里采样，靠近黑洞时自然被掰弯——logo 的签名动作，现在是活的。',
    cost: '每像素 1 次旋转 + 2 次 fbm · 开销极低',
    fs: `
void main() {
  vec2 frag = (gl_FragCoord.xy * 2.0 - u_res) / min(u_res.x, u_res.y);
  frag.x -= 0.35;
  frag -= u_mouse * 0.03;
  float b = length(frag);

  // deflection falls off fast — the ray bends only near the hole,
  // staying straight and logo-like further out
  float bc = 0.42;
  float alpha = 0.30 / pow(b - bc + 0.10, 1.4);
  float ca = cos(alpha), sa = sin(alpha);
  vec2 len = vec2(frag.x * ca - frag.y * sa, frag.x * sa + frag.y * ca);

  vec3 col = vec3(0.024, 0.024, 0.027);
  vec3 red = vec3(1.0, 0.16, 0.12);
  vec3 hot = vec3(1.0, 0.55, 0.42);

  // the ray: a diagonal line sampled in lensed space — near the hole
  // the lens map bends it around the shadow
  vec2 nd = normalize(vec2(-0.48, 0.88));
  float dl = abs(dot(len, nd));
  float along = dot(len, vec2(-nd.y, nd.x));
  float streak = exp(-dl * 22.0) * (0.55 + 0.45 * fbm(vec2(along * 2.0, u_time * 0.05)));
  col += red * streak * 0.9;
  col += hot * exp(-dl * 60.0) * 0.8;

  // thin wisps hugging the ring
  float wisp = fbm(vec2(atan(len.y, len.x) * 3.0, b * 6.0 - u_time * 0.08));
  col += red * exp(-max(b - bc, 0.0) * 3.0) * wisp * 0.35;

  // photon ring + outer halo
  col += hot * exp(-abs(b - bc) * 30.0) * 1.0;
  col += red * exp(-max(b - bc, 0.0) * 5.0) * 0.25;

  float edge = smoothstep(bc * 0.90, bc * 1.04, b);
  col = mix(vec3(0.008, 0.004, 0.005), col, edge);

  col = col / (1.0 + col * 0.45);
  col += dither();
  gl_FragColor = vec4(col, 1.0);
}`,
  },
]

const canvas = document.getElementById('gl')
const cssGlow = document.getElementById('cssGlow')
const gl = canvas.getContext('webgl', { antialias: false, depth: false, stencil: false, alpha: false })

const VERT = `attribute vec2 a_pos; void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`

function compile(type, src) {
  const sh = gl.createShader(type)
  gl.shaderSource(sh, src)
  gl.compileShader(sh)
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(sh) || 'compile failed')
  }
  return sh
}

const programs = new Map()
function getProgram(i) {
  if (programs.has(i)) return programs.get(i)
  const prog = gl.createProgram()
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT))
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, PRELUDE + CANDIDATES[i].fs))
  gl.linkProgram(prog)
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog) || 'link failed')
  }
  const entry = {
    prog,
    uRes: gl.getUniformLocation(prog, 'u_res'),
    uTime: gl.getUniformLocation(prog, 'u_time'),
    uMouse: gl.getUniformLocation(prog, 'u_mouse'),
  }
  programs.set(i, entry)
  return entry
}

if (gl) {
  const buf = gl.createBuffer()
  gl.bindBuffer(gl.ARRAY_BUFFER, buf)
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
}

let current = Math.min(
  Math.max(parseInt(new URLSearchParams(location.search).get('i') || '1', 10) - 1, 0),
  CANDIDATES.length - 1,
)
const mouse = { x: 0, y: 0 }
const start = performance.now()

function resize() {
  const scale = Math.min(window.devicePixelRatio || 1, 2)
  canvas.width = Math.floor(canvas.clientWidth * scale)
  canvas.height = Math.floor(canvas.clientHeight * scale)
}

function show(i) {
  current = (i + CANDIDATES.length) % CANDIDATES.length
  const c = CANDIDATES[current]
  document.getElementById('idx').textContent = `${current + 1} / ${CANDIDATES.length}`
  document.getElementById('name').textContent = c.name
  document.getElementById('desc').textContent = c.desc
  document.getElementById('cost').textContent = c.cost
  const useCss = !c.fs || !gl
  canvas.style.display = useCss ? 'none' : 'block'
  cssGlow.style.display = useCss ? 'block' : 'none'
  history.replaceState(null, '', `?i=${current + 1}`)
}

function frame(now) {
  const c = CANDIDATES[current]
  if (c.fs && gl) {
    resize()
    const { prog, uRes, uTime, uMouse } = getProgram(current)
    gl.useProgram(prog)
    const loc = gl.getAttribLocation(prog, 'a_pos')
    gl.enableVertexAttribArray(loc)
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0)
    gl.viewport(0, 0, canvas.width, canvas.height)
    gl.uniform2f(uRes, canvas.width, canvas.height)
    gl.uniform1f(uTime, (now - start) / 1000)
    gl.uniform2f(uMouse, mouse.x, mouse.y)
    gl.drawArrays(gl.TRIANGLES, 0, 3)
  }
  requestAnimationFrame(frame)
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show(current + 1)
  else if (e.key === 'ArrowLeft') show(current - 1)
  else if (e.key >= '1' && e.key <= String(CANDIDATES.length)) show(parseInt(e.key, 10) - 1)
})
window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1
  mouse.y = -((e.clientY / window.innerHeight) * 2 - 1)
})
window.addEventListener('resize', resize)

resize()
show(current)
requestAnimationFrame(frame)
</script>
</body>
</html>
