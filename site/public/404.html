<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060607" />
    <meta name="robots" content="noindex" />
    <title>Not found — AfterRay</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.4rem;
        padding: 2rem;
        background: #060607;
        color: #f2ede2;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC',
          'Helvetica Neue', sans-serif;
        line-height: 1.6;
      }
      .wrap { max-width: 1200px; width: 100%; margin: 0 auto; }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 3rem;
        color: inherit;
        text-decoration: none;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
      }
      .mark img { width: 22px; height: 22px; border-radius: 6px; }
      h1 {
        font-size: clamp(2.4rem, 7vw, 5rem);
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      h1 em {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-weight: 400;
        color: #ff4a3d;
      }
      p { margin-top: 1.4rem; color: rgba(242, 237, 226, 0.72); font-size: 1.05rem; }
      a.back {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.85rem 1.7rem;
        border-radius: 6px;
        background: #ff4a3d;
        color: #1a0503;
        font-size: 0.88rem;
        font-weight: 500;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="mark" href="/" data-home>
        <img src="/logo.png" alt="" width="22" height="22" />
        <span>AfterRay</span>
      </a>
      <h1
        data-en="This one it <em>doesn't</em> remember."
        data-zh-hans="这一页它<em>不记得</em>。"
        data-zh-hant="這一頁它<em>不記得</em>。"
        data-ja="このページは<em>覚えていません</em>。"
        data-ko="이 페이지는 <em>기억하지 않습니다</em>."
        data-es="Esta página <em>no</em> la recuerda."
        data-de="An diese Seite <em>erinnert es sich nicht</em>."
        data-fr="Celle-ci, il <em>ne s’en souvient pas</em>."
      >This one it <em>doesn't</em> remember.</h1>
      <p
        data-en="That page isn't here."
        data-zh-hans="那一页不在这儿。"
        data-zh-hant="那一頁不在這裡。"
        data-ja="そのページはありません。"
        data-ko="해당 페이지가 없습니다."
        data-es="Esa página no está aquí."
        data-de="Diese Seite ist nicht hier."
        data-fr="Cette page n’est pas ici."
      >That page isn't here.</p>
      <a
        class="back"
        href="/"
        data-home
        data-en="Back to AfterRay"
        data-zh-hans="回 AfterRay"
        data-zh-hant="回 AfterRay"
        data-ja="AfterRayに戻る"
        data-ko="AfterRay로 돌아가기"
        data-es="Volver a AfterRay"
        data-de="Zurück zu AfterRay"
        data-fr="Retour à AfterRay"
      >Back to AfterRay</a>
      <script>
        (function () {
          var homes = {
            en: '/',
            'zh-Hans': '/zh/',
            'zh-Hant': '/zh-hant/',
            ja: '/ja/',
            ko: '/ko/',
            es: '/es/',
            de: '/de/',
            fr: '/fr/',
          }
          var htmlLang = {
            en: 'en',
            'zh-Hans': 'zh-Hans',
            'zh-Hant': 'zh-Hant',
            ja: 'ja',
            ko: 'ko',
            es: 'es',
            de: 'de',
            fr: 'fr',
          }
          var titles = {
            en: 'Not found — AfterRay',
            'zh-Hans': '未找到 — AfterRay',
            'zh-Hant': '找不到 — AfterRay',
            ja: '見つかりません — AfterRay',
            ko: '찾을 수 없음 — AfterRay',
            es: 'No encontrado — AfterRay',
            de: 'Nicht gefunden — AfterRay',
            fr: 'Introuvable — AfterRay',
          }
          var lang = 'en'
          try {
            var match = (location.pathname || '').match(/^\/(zh-hant|zh|ja|ko|es|de|fr)(?:\/|$)/)
            if (match) {
              lang = match[1] === 'zh' ? 'zh-Hans' : match[1] === 'zh-hant' ? 'zh-Hant' : match[1]
            }
          } catch (e) {}
          var attr = lang.toLowerCase()
          document.documentElement.lang = htmlLang[lang] || 'en'
          document.title = titles[lang] || titles.en
          document.querySelectorAll('[data-en]').forEach(function (el) {
            el.innerHTML = el.getAttribute('data-' + attr) || el.getAttribute('data-en')
          })
          document.querySelectorAll('[data-home]').forEach(function (el) {
            el.setAttribute('href', homes[lang] || '/')
          })
        })()
      </script>
    </div>
  </body>
</html>
