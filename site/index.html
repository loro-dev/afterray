<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060607" />
    <meta
      name="description"
      content="AfterRay captures your screen and the audio around it all day and keeps it on this Mac. Replay any moment, search it by half a phrase, or let Claude Code and Codex look it up for you."
    />
    <title>AfterRay — A searchable recording of everything you see and hear.</title>

    <!-- Social preview. og:image is relative; set an absolute URL (and add a
         1200x630 og.png) once the production domain is known, otherwise some
         crawlers will skip the image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AfterRay" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:title" content="AfterRay — A searchable recording of everything you see and hear." />
    <meta
      property="og:description"
      content="AfterRay captures your Mac's screen and audio all day and turns it into a searchable recording — replay any moment, search it, or let your coding agent look it up. Nothing leaves the machine."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The AfterRay mark — a scarlet ray bent around a dark horizon." />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AfterRay — A searchable recording of everything you see and hear." />
    <meta
      name="twitter:description"
      content="AfterRay captures your Mac's screen and audio all day and turns it into a searchable recording — replay any moment, search it, or let your coding agent look it up. Nothing leaves the machine."
    />
    <meta name="twitter:image" content="/logo.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
