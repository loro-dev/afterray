<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060607" />
    <meta
      name="description"
      content="AfterRay records your screen and audio all day — so you and your agent can find anything you saw or heard."
    />
    <title>AfterRay — Remember everything you see and hear on your Mac.</title>

    <link rel="canonical" href="https://afterray.com/" />

    <!-- Social preview -->
    <meta property="og:url" content="https://afterray.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AfterRay" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:title" content="AfterRay — Remember everything you see and hear on your Mac." />
    <meta
      property="og:description"
      content="AfterRay records your Mac's screen and audio all day so any moment stays searchable — replay it, search it, or let your coding agent look it up. Exclude apps and sites, pause anytime, and nothing leaves the machine."
    />
    <meta property="og:image" content="https://afterray.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AfterRay — Remember everything. Records your screen and audio all day; nothing leaves this Mac." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AfterRay — Remember everything you see and hear on your Mac." />
    <meta
      name="twitter:description"
      content="AfterRay records your Mac's screen and audio all day so any moment stays searchable — replay it, search it, or let your coding agent look it up. Exclude apps and sites, pause anytime, and nothing leaves the machine."
    />
    <meta name="twitter:image" content="https://afterray.com/og.png" />

    <!-- No offers or ratings: the app is not packaged for distribution yet,
         and inventing either would be a claim the product cannot back. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AfterRay",
        "url": "https://afterray.com/",
        "image": "https://afterray.com/og.png",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "macOS 15 or later, Apple Silicon",
        "description": "Local-first computer history for Mac. AfterRay records your screen and audio all day so any moment stays searchable — replay it, search it, or let a coding agent look it up. Capture, indexing, and the model all run on the machine.",
        "featureList": [
          "Replay any moment of your day: the screen as it was, the audio as it sounded",
          "Full-text and on-device semantic search over OCR text and transcripts",
          "Answers cited to replayable moments",
          "Half-hour summaries written on device",
          "Read-only CLI and Agent Skill for Claude Code and Codex",
          "Exclude apps and sites, pause, or delete history at any time",
          "Encrypted vault: SQLCipher and XChaCha20-Poly1305, key in the macOS Keychain"
        ]
      }
    </script>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
